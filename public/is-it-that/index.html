<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minimal</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      display: grid;
      place-items: center;
    }
    video {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <video id="player" autoplay loop muted playsinline src="/assets/extra/is-it-that/ball-jumping.webm"></video>

  <script>
    const player = document.getElementById('player');
    let clicked = false;

    player.addEventListener('click', () => {
      clicked = true;
    });

    player.addEventListener('timeupdate', () => {
      if (clicked && player.currentTime < 0.1) {
        player.src = '/assets/extra/is-it-that/somewhat-creepy-face-a.webm';
        player.loop = false;
        player.play();
        clicked = false;
      }
    });

    player.addEventListener('ended', () => {
      if (player.src.endsWith('/assets/extra/is-it-that/somewhat-creepy-face-a.webm')) {
        player.src = '/assets/extra/is-it-that/eye.webm';
        player.play();
      }
    });
  </script>
</body>
</html>
